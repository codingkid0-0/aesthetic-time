!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>California Time</title>

<style>
* {
     margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    background:#000;
    font-family:'Segoe UI',sans-serif;
}

video{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    object-fit:cover;
    z-index:-2;
}

body {
    overflow: hidden;
    font-family: Arial, sans-serif;
    background: black;
}

/* Fullscreen Video */
video {
    position: fixed;
    top: 0;
    left: 0;
    min-width: 100%;
    min-height: 100%;
    object-fit: cover;
    z-index: -1;
}

/* Time Display */
#clock {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: white;
    font-size: 4rem;
    font-weight: bold;
    text-shadow: 2px 2px 10px black;
    background: rgba(0,0,0,0.3);
    padding: 20px 40px;
    border-radius: 15px;
}
</style>
</head>

<body>

<video autoplay muted loop playsinline>
    <source src="background.mp4" type="video/mp4">
    Your browser does not support HTML5 video.
</video>

<div id="clock"></div>

<script>
function updateClock() {
    const options = {
        timeZone: "America/Los_Angeles",
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hour12: true
    };

    const californiaTime = new Date().toLocaleTimeString("en-US", options);
    document.getElementById("clock").textContent = californiaTime;
}

updateClock();
setInterval(updateClock, 1000);
</script>

</body>
</html>
